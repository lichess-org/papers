name: Tidy BibTeX
on:
  push:
    branches:
      - main
    paths:
      - 'lichess.bib'

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'bibtexparser<2' requests rich
      - run: python scripts/generate-bibkeys.py lichess.bib
      - run: make tidy
      - run: python scripts/generate-readme-stats.py lichess.bib
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: bibtex-tidy"
